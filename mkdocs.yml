site_name: Jev Docs (CN)
site_description: TypeSafe / Jev documentation (English source mirror for Chinese translation)
site_author: ningg@GitHub
site_url: https://ningg.github.io/jev-docs-CN/
repo_url: https://github.com/ningg/jev-docs-CN
repo_name: ningg/jev-docs-CN
docs_dir: docs
site_dir: site
use_directory_urls: true
copyright: Content mirrored from docs.typesafe.ai for translation and local browsing.

theme:
  name: material
  custom_dir: overrides
  language: en
  font:
    text: Inter
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/typesafe-links.js

markdown_extensions:
  - meta
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

extra:
  generator: false

